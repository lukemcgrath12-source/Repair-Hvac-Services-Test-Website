<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>REPAIR HVAC SERVICES — Quoting System</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#1E1B4B;--teal:#0D7A7A;--slate-800:#1e293b;--slate-700:#334155;--slate-400:#94a3b8;--slate-300:#cbd5e1;--slate-200:#e2e8f0;--slate-100:#f1f5f9;--slate-50:#f8fafc;--r:12px;--sh:0 1px 3px rgba(0,0,0,.08);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--slate-50);color:var(--slate-800);min-height:100vh;}
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;background:#0d0b2e;position:fixed;left:0;top:0;bottom:0;display:flex;flex-direction:column;z-index:100;}
#main{margin-left:220px;flex:1;padding:32px;overflow-y:auto;}
.sb-logo{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-logo-text{color:white;font-size:19px;font-weight:900;}
.sb-sub{color:var(--teal);font-size:10px;text-transform:uppercase;letter-spacing:2px;margin-top:2px;}
.sb-nav{padding:14px 12px;flex:1;}
.sb-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;border:none;background:none;color:var(--slate-400);font-size:13px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.sb-btn:hover{background:rgba(255,255,255,.06);color:white;}
.sb-btn.active{background:var(--teal);color:white;}
.card{background:white;border-radius:var(--r);border:1px solid var(--slate-200);box-shadow:var(--sh);}
.card-pad{padding:20px;}
.btn-primary{padding:9px 16px;background:var(--teal);color:white;border:none;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-secondary{padding:8px 14px;background:white;color:var(--slate-700);border:1px solid var(--slate-200);border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.form-input{width:100%;padding:8px 11px;border:1px solid var(--slate-200);border-radius:7px;font-size:12px;font-family:'DM Sans',sans-serif;outline:none;}
.form-input:focus{border-color:var(--teal);}
.form-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--slate-500);margin-bottom:5px;display:block;}
.modal{display:flex;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;}
.modal.hidden{display:none;}
.modal-content{background:white;border-radius:var(--r);padding:28px;width:90%;max-width:400px;}
.modal-header{font-size:16px;font-weight:900;margin-bottom:18px;text-align:center;}
.modal-footer{display:flex;gap:9px;justify-content:flex-end;margin-top:22px;}
#toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:12px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s;z-index:300;}
#toast.show{opacity:1;}
.page-title{font-size:22px;font-weight:900;}
.page-sub{font-size:13px;color:var(--slate-400);margin-top:3px;}
#view-form,#view-clients,#view-products,#view-settings{display:none;}
</style>
</head>
<body>

<div id="auth-modal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <div style="font-size:16px;font-weight:900;color:var(--navy);">REPAIR<span style="color:var(--teal);">.</span></div>
      <div style="font-size:11px;color:var(--slate-400);text-transform:uppercase;letter-spacing:1px;margin-top:4px;">Quoting System</div>
    </div>
    <div style="margin-bottom:18px;">
      <label class="form-label">Password</label>
      <input type="password" id="pwd-input" class="form-input" placeholder="Enter password" style="text-align:center;"/>
    </div>
    <button class="btn-primary" style="width:100%;cursor:pointer;" onclick="authCheck()">Access System</button>
    <div style="font-size:11px;color:var(--slate-400);text-align:center;margin-top:12px;">Internal use only</div>
  </div>
</div>

<div id="app" class="hidden">
  <div id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-text">REPAIR<span style="color:var(--teal);">.</span></div>
      <div class="sb-sub">Quoting</div>
    </div>
    <div class="sb-nav">
      <button class="sb-btn active" onclick="go('dashboard')">📊 Dashboard</button>
      <button class="sb-btn" onclick="go('form')">✏️ New Quote</button>
      <button class="sb-btn" onclick="go('clients')">👥 Clients</button>
      <button class="sb-btn" onclick="go('products')">📦 Materials</button>
      <button class="sb-btn" onclick="go('settings')">⚙️ Settings</button>
    </div>
  </div>

  <div id="main">
    <div id="view-dashboard">
      <div class="page-title">Dashboard</div>
      <div class="page-sub">Overview of your quoting activity</div>
      <div style="margin-top:20px;padding:20px;background:white;border-radius:12px;border:1px solid var(--slate-200);">
        <p>Dashboard coming soon</p>
      </div>
    </div>
    
    <div id="view-form">
      <div class="page-title">New Quote</div>
      <div style="margin-top:20px;padding:20px;background:white;border-radius:12px;border:1px solid var(--slate-200);">
        <p>Quote builder coming soon</p>
      </div>
    </div>
    
    <div id="view-clients">
      <div class="page-title">Clients</div>
      <div style="margin-top:20px;padding:20px;background:white;border-radius:12px;border:1px solid var(--slate-200);">
        <p>Clients list coming soon</p>
      </div>
    </div>
    
    <div id="view-products">
      <div class="page-title">Materials</div>
      <div style="margin-top:20px;padding:20px;background:white;border-radius:12px;border:1px solid var(--slate-200);">
        <p>Materials list coming soon</p>
      </div>
    </div>
    
    <div id="view-settings">
      <div class="page-title">Settings</div>
      <div style="margin-top:20px;padding:20px;background:white;border-radius:12px;border:1px solid var(--slate-200);">
        <p>Settings coming soon</p>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://gyhemsaxriyvvggsffjh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xd8AMjH-MdnkMpVW6cyIsA_Sm6__Mnq';
const PASSWORD = 'RepAIR2024';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function authCheck(){
  const pwd = document.getElementById('pwd-input').value;
  if(pwd === PASSWORD){
    sessionStorage.setItem('qa', '1');
    showApp();
  }else{
    alert('Wrong password');
    document.getElementById('pwd-input').value = '';
  }
}

function showApp(){
  document.getElementById('auth-modal').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

function go(view){
  document.querySelectorAll('[id^="view-"]').forEach(v => v.style.display = 'none');
  document.getElementById('view-' + view).style.display = 'block';
  document.querySelectorAll('.sb-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

document.getElementById('pwd-input').addEventListener('keypress', (e) => {
  if(e.key === 'Enter') authCheck();
});

if(sessionStorage.getItem('qa') === '1'){
  showApp();
}
</script>

</body>
</html>
