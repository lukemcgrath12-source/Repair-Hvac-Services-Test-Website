  <style>
    :root { --navy: #1E1B4B; --teal: #0D7A7A; --teal-l: #5bbaba; --paper: #f4f4f8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--paper); color: var(--navy);
      font-family: 'DM Sans', sans-serif; line-height: 1.7;
      padding: 48px 20px; text-align: center;
    }
    img.logo { width: 200px; height: auto; margin-bottom: 40px; }
    h1 {
      font-family: 'DM Serif Display', serif; font-weight: 400;
      font-size: clamp(36px, 7vw, 60px); line-height: 1.05; letter-spacing: -0.03em;
      margin-bottom: 18px;
    }
    h1 em { color: var(--teal); }
    p { max-width: 44ch; margin: 0 auto 32px; color: rgba(30,27,75,0.7); font-size: 17px; }
    .btns { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn {
      display: inline-block; padding: 14px 26px; border-radius: 100px;
      font-weight: 700; font-size: 15px; text-decoration: none;
      transition: transform .25s cubic-bezier(.16,1,.3,1), opacity .25s;
    }
    a.btn:hover { transform: translateY(-2px); }
    a.btn:active { transform: translateY(0); }
    a.btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    .primary { background: var(--teal); color: #fff; }
    .ghost { border: 1.5px solid rgba(30,27,75,0.2); color: var(--navy); }
  </style>
</head>
